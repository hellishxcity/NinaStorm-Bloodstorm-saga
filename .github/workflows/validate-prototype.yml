name: Validate NinaStorm Browser Prototype

on:
  push:
    branches:
      - fix/bloodright-claim-integrity
  pull_request:
    paths:
      - 'docs/index.html'
      - 'scripts/validate-prototype.mjs'
      - '.github/workflows/validate-prototype.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate prototype syntax and Bloodright invariants
        run: node scripts/validate-prototype.mjs
